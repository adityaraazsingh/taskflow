# Activated with SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile).

# Never expose the H2 web console in production.
spring.h2.console.enabled=false

# No fallback: the application refuses to start without a JWT_SECRET of at least 32 bytes.
app.jwt.secret=${JWT_SECRET}

# Point DB_PATH at a persistent volume (e.g. a Render Disk mounted at /var/data), otherwise the
# database lives on the container's ephemeral filesystem and is wiped on every deploy/restart.
spring.datasource.url=jdbc:h2:file:${DB_PATH:/var/data/taskflow/db}

# Render/most PaaS terminate TLS at a proxy; honour X-Forwarded-* so redirects/links use https.
server.forward-headers-strategy=framework

# Do not leak internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

logging.level.com.projectManagement.taskflow.security=INFO
