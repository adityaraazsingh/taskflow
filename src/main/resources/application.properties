spring.application.name=taskflow
# DB_PATH lets production point at a persistent volume (e.g. a Render disk mounted at /var/data).
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Development only - switched off by the 'prod' profile (application-prod.properties).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# The fallback below is for local development ONLY. The 'prod' profile has no fallback and
# refuses to start unless JWT_SECRET is provided (>= 32 bytes).
app.jwt.secret=${JWT_SECRET:IAMTHEBESTSTRONESTMANPRESENTONETHEEARTHIWILLCHANGEEVERYTHING}
app.jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
app.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:604800}

# Comma separated list of origin patterns allowed for REST (CORS) and WebSocket handshakes.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# spring.liquibase.change-log=classpath:db/changelog/dbchangelog.sql  
spring.liquibase.change-log=classpath:db.changelog-master.xml  
spring.liquibase.enabled=true
spring.jpa.open-in-view=false
spring.main.allow-circular-references=false
spring.cache.type=simple
#"Do NOT treat my repositories as Redis repositories"
spring.data.redis.repositories.enabled=false



