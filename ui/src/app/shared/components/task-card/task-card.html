<article
  class="task-card-group relative cursor-pointer"
  [ngClass]="priorityBorderClass"
  (click)="onTaskClick()"
>
  <!-- Priority indicator bar -->
  <div class="absolute left-0 top-0 bottom-0 w-1 rounded-l-xl" [ngClass]="priorityIndicatorClass"></div>
  
  <div class="task-card-inner relative bg-white rounded-xl ring-1 ring-gray-100 shadow-sm hover:shadow-lg hover:shadow-indigo-100/30 hover:-translate-y-1 transition-all duration-300 group">
    <!-- Top row: Status badge + Priority tag -->
    <div class="task-meta flex items-center justify-between mb-2.5">
      <app-status-badge [status]="task().status" />
      <app-priority-tag [priority]="priorityLabel" />
    </div>

    <!-- Title -->
    <h4 class="task-title text-sm font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors leading-snug mb-1.5">
      {{ task().title }}
    </h4>

    <!-- Description -->
    <p class="task-description text-xs text-gray-500 line-clamp-2 mb-3 leading-relaxed">
      {{ task().description || 'No description provided' }}
    </p>

    <!-- Footer: Assignee + Meta -->
    <div class="task-footer flex items-center justify-between pt-2 border-t border-gray-50">
      <!-- Assignee avatar -->
      <div class="assignee-meta flex items-center gap-2">
        <div class="assignee-avatar size-6 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 ring-2 ring-white flex items-center justify-center text-[9px] font-bold text-white shadow-sm">
          {{ assigneeInitial }}
        </div>
        <span class="assignee-label text-[11px] text-gray-400 font-medium">Assignee</span>
      </div>

      <!-- Due date + Comments -->
      <div class="task-meta-items flex items-center gap-3 text-[11px]">
        <!-- Due Date -->
        @if (task().dueDate) {
          <div class="due-date flex items-center gap-1.5 px-2 py-0.5 rounded-lg backdrop-blur-sm transition-all duration-200" [ngClass]="{
            'bg-rose-50 text-rose-600': isOverdue(task().dueDate),
            'bg-gray-50 text-gray-500': !isOverdue(task().dueDate)
          }">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="font-medium">{{ getDueDateLabel(task().dueDate) }}</span>
          </div>
        }
        <!-- Comments count -->
        @if (task().comments && task().comments!.length > 0) {
          <div class="comment-count flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-gray-50 text-gray-500 hover:bg-gray-100 transition-all duration-200">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
            </svg>
            <span class="font-medium">{{ task().comments!.length }}</span>
          </div>
        }
      </div>
    </div>
  </div>
  <!-- Hover overlay effect -->
  <div class="absolute inset-0 rounded-xl bg-gradient-to-br from-indigo-500/5 to-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
</article>
