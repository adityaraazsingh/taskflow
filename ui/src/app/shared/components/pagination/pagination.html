<div class="pagination-wrapper">
  <!-- Mobile prev/next -->
  <div class="flex sm:hidden justify-center gap-2 pb-4">
    <button type="button" (click)="prevPage()" [disabled]="currentPage === 0"
      class="mobile-page-btn inline-flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-medium text-gray-600 bg-white ring-1 ring-gray-200 hover:bg-gray-50 hover:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
      <span>Previous</span>
      <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
    </button>
    <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
      class="mobile-page-btn inline-flex items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-medium text-gray-600 bg-white ring-1 ring-gray-200 hover:bg-gray-50 hover:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
      <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
      <span>Next</span>
    </button>
  </div>

  <!-- Desktop info + pagination -->
  <div class="hidden sm:block">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="pagination-info">
        <p class="text-sm text-gray-600">
          Showing <span class="page-number font-semibold text-gray-900">{{ currentPage * 10 + 1 }}</span>
          <span class="text-gray-400"> to </span>
          <span class="page-number font-semibold text-gray-900">{{ (currentPage + 1) * 10 }}</span>
          <span class="text-gray-400"> of </span>
          <span class="total-items font-semibold text-gray-900">{{ totalItems }}</span>
          <span class="text-gray-400"> results</span>
        </p>
      </div>
      <div class="pagination-controls flex items-center gap-1">
        <nav class="inline-flex items-center -space-x-1" aria-label="Pagination">
          <button type="button" (click)="prevPage()" [disabled]="currentPage === 0"
            class="prev-page-btn inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-medium text-gray-600 bg-white ring-1 ring-gray-200 hover:bg-gray-50 hover:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
            <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
            Prev
          </button>
          @for (page of pageNumbers.slice(0, 10); track page) {
            <button type="button" (click)="goToPage(page - 1)"
              class="page-btn inline-flex items-center justify-center min-w-[32px] h-8 px-2 rounded-lg text-sm font-semibold transition-all duration-200"
              [ngClass]="page - 1 === currentPage ? 'page-btn-active' : 'page-btn-default'">
              {{ page }}
            </button>
          }
          <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
            class="next-page-btn inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-medium text-gray-600 bg-white ring-1 ring-gray-200 hover:bg-gray-50 hover:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
            Next
            <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
          </button>
        </nav>
      </div>
    </div>
  </div>
</div>
