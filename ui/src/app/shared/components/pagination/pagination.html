<div class="pagination-bar flex items-center justify-between px-4 py-3 sm:px-6">
  <!-- Mobile prev/next -->
  <div class="flex flex-1 justify-between sm:hidden">
    <button type="button" (click)="prevPage()" [disabled]="currentPage === 0"
      class="mobile-page-btn relative inline-flex items-center rounded-lg px-4 py-2 text-sm font-medium text-gray-700 bg-white soft-ring hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
      Previous
    </button>
    <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
      class="mobile-page-btn relative ml-3 inline-flex items-center rounded-lg px-4 py-2 text-sm font-medium text-gray-700 bg-white soft-ring hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
      Next
    </button>
  </div>

  <!-- Desktop info + pagination -->
  <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between gap-4">
    <div class="pagination-info">
      <p class="text-sm text-gray-600">
        Page <span class="page-number font-semibold text-gray-900">{{ currentPage + 1 }}</span> of <span class="total-pages font-semibold text-gray-900">{{ totalPages }}</span>
        <span class="separator mx-1.5 text-gray-300">·</span>
        <span class="total-items font-semibold text-gray-900">{{ totalItems }}</span> total items
      </p>
    </div>
    <div class="pagination-controls">
      <nav class="isolate inline-flex -space-x-px rounded-lg shadow-xs" aria-label="Pagination">
        <button type="button" (click)="prevPage()" [disabled]="currentPage === 0"
          class="prev-page-btn relative inline-flex items-center rounded-l-lg px-3 py-2 text-gray-400 soft-ring hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200">
          <svg class="size-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
        </button>
        @for (page of pageNumbers; track page) {
          <button type="button" (click)="goToPage(page - 1)"
            class="page-btn relative inline-flex items-center px-4 py-2 text-sm font-semibold soft-ring transition-all duration-200"
            [ngClass]="page - 1 === currentPage ? 'z-10 page-btn-active' : 'page-btn-default'">
            {{ page }}
          </button>
        }
        <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
          class="next-page-btn relative inline-flex items-center rounded-r-lg px-3 py-2 text-gray-400 soft-ring hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200">
          <svg class="size-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
        </button>
      </nav>
    </div>
  </div>
</div>
