<span class="priority-tag inline-flex items-center gap-1 rounded-md text-xs font-semibold soft-ring transition-all duration-200" [ngClass]="{
    'priority-high': priority === 'HIGH',
    'priority-medium': priority === 'MED',
    'priority-low': priority === 'LOW'
  }">
  <svg class="priority-icon w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
    <path d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z"/>
  </svg>
  {{ priority }}
</span>
