<span class="status-badge inline-flex items-center gap-1.5 rounded-full text-xs font-medium soft-ring transition-all duration-200" [ngClass]="{
    'status-active': status === 'ACTIVE' || status === 'DONE',
    'status-in-progress': status === 'IN_PROGRESS' || status === 'TODO',
    'status-archived': status === 'ARCHIVED',
    'status-completed': status === 'COMPLETED'
  }">
  <span class="status-dot w-1.5 h-1.5 rounded-full" [ngClass]="{
    'dot-emerald': status === 'ACTIVE' || status === 'DONE',
    'dot-amber': status === 'IN_PROGRESS' || status === 'TODO',
    'dot-gray': status === 'ARCHIVED',
    'dot-blue': status === 'COMPLETED'
  }"></span>
  {{ status | titlecase }}
</span>
