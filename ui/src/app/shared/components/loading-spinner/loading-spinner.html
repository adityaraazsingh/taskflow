<div class="loading-root flex flex-col items-center justify-center gap-4 py-16">
  <div class="loading-spinner relative size-12">
    <div class="loading-track absolute inset-0 rounded-full border-4 border-indigo-100"></div>
    <div class="loading-indicator absolute inset-0 rounded-full border-4 border-transparent border-t-indigo-600 animate-spin"></div>
  </div>
  @if (message) {
    <p class="loading-message text-sm font-medium text-gray-500">{{ message }}</p>
  }
</div>
