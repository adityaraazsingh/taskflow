<div class="loading-root flex flex-col items-center justify-center gap-5 py-16">
  <div class="loading-spinner relative size-14">
    <div class="loading-ring absolute inset-0 rounded-full bg-indigo-100/50"></div>
    <div class="loading-ring absolute inset-2 rounded-full bg-indigo-200/50"></div>
    <div class="loading-indicator absolute inset-0 rounded-full border-4 border-transparent border-t-indigo-600 border-r-indigo-400 animate-spin"></div>
  </div>
  @if (message) {
    <div class="loading-message-wrapper animate-pulse">
      <p class="loading-message text-sm font-medium text-gray-500">{{ message }}</p>
    </div>
  }
</div>
