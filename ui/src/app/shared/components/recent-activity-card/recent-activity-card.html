@for(notification of (notifications$ | async); track $index) {
    <div (click)="navigateToTheEvent(notification)" class="flex items-start gap-3 p-4 hover:bg-gray-50 transition-colors">
        <div class="size-8 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
        </div>
        <div class="flex-1 min-w-0">
            <p class="text-sm text-gray-900"><span class="font-medium">{{notification.eventType}}</span> {{notification.message}}</p>
        </div>
    </div>
}@empty {
    <div>No notifications available.</div>
}
