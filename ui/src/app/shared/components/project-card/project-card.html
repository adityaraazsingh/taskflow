<article class="project-card bg-white rounded-xl soft-ring overflow-hidden shadow-sm hover:shadow-xl hover:shadow-indigo-100/40 transition-all duration-300 group cursor-pointer hover:-translate-y-1">
    <!-- Gradient accent bar -->
    <div class="project-accent absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
    <div class="p-5 relative">
        <div class="flex items-start justify-between gap-3 mb-3">
            <div class="min-w-0">
                <h3 class="project-title font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors truncate"><ng-content select=[title]/></h3>
            </div>
            <span class="project-status inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 soft-ring ring-1 ring-emerald-200/50 transition-all duration-200">
                <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
                <ng-content select=[status]/>
            </span>
        </div>
        <p class="project-description text-sm text-gray-500 leading-relaxed line-clamp-2 mb-4"><ng-content select=[description]/></p>
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="member-avatars flex -space-x-1.5">
                    <div class="member-dot size-7 rounded-full bg-gradient-to-br from-indigo-400 to-indigo-600 ring-2 ring-white flex items-center justify-center text-[10px] font-semibold text-white shadow-sm">AK</div>
                    <div class="member-dot size-7 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 ring-2 ring-white flex items-center justify-center text-[10px] font-semibold text-white shadow-sm">JR</div>
                    <div class="member-dot size-7 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 ring-2 ring-white flex items-center justify-center text-[10px] font-semibold text-white shadow-sm">SP</div>
                    <div class="member-more size-7 rounded-full bg-gray-100 ring-2 ring-white flex items-center justify-center text-[10px] font-medium text-gray-500 border border-gray-200">+</div>
                </div>
            </div>
            <div class="task-progress inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-gray-50 text-xs text-gray-500 hover:bg-gray-100 transition-all duration-200">
                <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="font-medium"><ng-content select=[numberOfTaskCompleted]/></span>
            </div>
        </div>
    </div>
    <!-- Hover overlay -->
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/5 to-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none rounded-b-xl"></div>
</article>
